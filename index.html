<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike Health</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brown': {
                            'dark': '#3d2314',
                        },
                        'cream': '#faf8f5',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'EB Garamond', Georgia, serif;
        }
    </style>
</head>
<body class="bg-cream text-brown-dark min-h-screen">
    <div class="min-h-screen flex">
        <!-- Left Content -->
        <div class="flex-1 p-12 lg:p-20 flex flex-col justify-center max-w-2xl">
            <!-- Logo/Brand -->
            <h1 class="text-4xl md:text-5xl font-medium mb-8">
                Spike Health
            </h1>

            <!-- Mission -->
            <p class="text-xl md:text-2xl leading-relaxed mb-12">
                We help people and companies design supplements that respect the biological reality of the human body.
            </p>

            <!-- Contact -->
            <a href="mailto:contact@spikehealth.co" class="text-lg hover:underline">
                Get in touch &rarr;
            </a>

            <!-- Exhibits -->
            <div class="mt-10">
                <h2 class="text-sm uppercase tracking-[0.2em] text-brown-dark/70 mb-3">
                    Exhibits
                </h2>
                <ul class="space-y-2 text-lg">
                    <li>
                        <a
                            href="https://tryspike.store"
                            class="hover:underline underline-offset-4"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            tryspike.store
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Right Image -->
        <div class="hidden lg:flex w-2/5 items-center justify-center p-8">
            <img
                src="image.jpeg"
                alt="Classical painting"
                class="max-w-full max-h-[80vh] w-auto h-auto object-contain"
            >
        </div>
    </div>
</body>
</html>
